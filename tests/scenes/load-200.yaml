# PLAN 2.9 load fixture (tests and tools/tick_drift.py only, not a shipped scene): ten parallel
# 30 m lanes, each fed a box every second, so the scene reaches the 200-part cap (core/world.py)
# about 20 s in and stays there with every part moving. Run it with every belt and emitter forced
# on (tools/tick_drift.py --force ...). Training and demo use only. Not a safety-rated simulation.
openfactory: "0.1"
scene:
  name: load-200
  description: Ten 30 m lanes, a box a second each, to load the tick loop at the 200-part cap.
  seed: 1
components:
  - id: CONV_01
    type: belt_conveyor
    description: Load Lane 01 Belt Conveyor
    position: [-15.0, 0, -9.0]
    length: 30.0
    width: 0.5
    speed_mps: 0.5
    io:
      run: CONV_01_RUN_DO
  - id: EMT_01
    type: box_emitter
    description: Load Lane 01 Box Source
    position: [-14.8, 0.2, -9.0]
    interval_s: 1.0
    parts:
      - {name: box, size: [0.3, 0.2, 0.3], weight: 1.0}
    io:
      enable: EMT_01_EN_DO
  - id: REM_01
    type: part_remover
    description: Load Lane 01 Discharge Part Remover
    position: [15.1, 0, -9.0]
    size: [0.3, 1.0, 0.5]
  - id: CONV_02
    type: belt_conveyor
    description: Load Lane 02 Belt Conveyor
