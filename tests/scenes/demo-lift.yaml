# PLAN 2.5b test scene (tests only, not shipped): an infeed belt at floor level feeds a lift, which
# raises each box 0.6 m and hands it to an upper outfeed belt. The stand-in script beside it
# (demo-lift.py) runs the cycle. Training and demo use only. Not a safety-rated simulation.
openfactory: "0.1"
scene:
  name: demo-lift
  description: Boxes raised 0.6 m by a lift from an infeed belt to an upper outfeed belt.
  author: HIS Controls
  seed: 5
plc:
  protocol: modbus_tcp
checks:
  duration_s: 60
  parts_reached: {REM_01: box}
  none_lost: true
  max_cycle_s: 20                  # measured 16.58 s at 60 s and 300 s under demo-lift.py
components:
  - id: CONV_IN
    type: belt_conveyor
    description: Lift Infeed Belt Conveyor
    position: [0, 0, 0]
    length: 2.0
    width: 0.5
    speed_mps: 0.5
    io:
      run: CONV_IN_RUN_DO
  - id: EMT_01
    type: box_emitter
    description: Lift Infeed Box Source
    position: [0.3, 0.155, 0]
    interval_s: 8.0
    parts:
      - {name: box, size: [0.3, 0.3, 0.3], weight: 1.0}
    io:
      enable: EMT_01_EN_DO
  - id: LFT_01
    type: lift
    description: Box Lift
    position: [2.0, 0, 0]
    length: 1.0
    width: 0.5
    speed_mps: 0.5
    lift_height: 0.6
    lift_time_s: 1.5
    io:
      run: LFT_01_RUN_DO
      raise: LFT_01_RAISE_DO
      running: LFT_01_RUN_DI
      at_top: LFT_01_TOP_DI
      at_bottom: LFT_01_BOT_DI
  - id: PE_LIFT
    type: photo_eye
    description: Lift Deck Box Present Photo Eye
    position: [2.75, 0.15, 0]       # near the deck's discharge end, at the bottom
    beam_length: 0.6
    io:
      detect: PE_LIFT_DI
  - id: CONV_OUT
    type: belt_conveyor
    description: Lift Upper Outfeed Belt Conveyor
    position: [3.0, 0.6, 0]
    length: 2.0
    width: 0.5
    speed_mps: 0.5
    io:
      run: CONV_OUT_RUN_DO
  - id: REM_01
    type: part_remover
    description: Upper Outfeed Discharge Part Remover
    position: [5.15, 0.6, 0]
    size: [0.3, 1.0, 1.0]
connections:
  - {from: CONV_IN, to: LFT_01}
  - {from: LFT_01, to: CONV_OUT}
