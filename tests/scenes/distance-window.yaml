# PLAN 2.5 / 2.17 test scene (tests only, not a shipped scene): a window transform end to end. A
# distance sensor looks down at a belt carrying tall (0.4 m) and short (0.2 m) boxes. Its distance
# goes to the PLC as an AI, and its switching output is windowed to a DI that is true while the
# distance is 0.1 to 0.3 m: a tall box under it (0.2 m away), not a short one (0.4 m) or the bare
# belt (0.6 m). int16_scaled, so the lockfile records the sensor's 0 to 0.8 m range.
# Training and demo use only. Not a safety-rated simulation.
openfactory: "0.1"
scene:
  name: distance-window
  description: Box height check with a distance sensor and a windowed switching output.
  seed: 5
plc:
  protocol: modbus_tcp
  analog_encoding: int16_scaled
components:
  - id: CONV_01
    type: belt_conveyor
    description: Height Check Belt Conveyor
    position: [0, 0, 0]
    length: 3.0
    width: 0.5
    speed_mps: 0.5
    io:
      run: CONV_01_RUN_DO
  - id: DS_01
    type: distance_sensor
    description: Box Height Distance Sensor
    position: [1.5, 0.6, 0]        # 0.6 m above the belt, looking down
    axis: "-y"
    beam_length: 0.8
    io:
      distance: DS_01_DIST_AI
      switching: {tag: DS_01_TALL_DI, window: [0.1, 0.3]}
  - id: EMT_01
    type: box_emitter
    description: Height Check Box Source
    position: [0.3, 0.25, 0]
    interval_s: 2.0
    parts:
      - {name: tall, size: [0.3, 0.4, 0.3], weight: 0.5}
      - {name: short, size: [0.3, 0.2, 0.3], weight: 0.5}
    io:
      enable: EMT_01_EN_DO
  - id: REM_01
    type: part_remover
    description: Height Check Discharge Part Remover
    position: [3.15, 0, 0]
    size: [0.3, 1.0, 1.0]
