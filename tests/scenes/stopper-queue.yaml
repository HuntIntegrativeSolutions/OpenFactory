# PLAN 2.5 parity fixture (tests only, not a shipped scene): queue formation against a stopper.
# Five boxes start spaced along running belt CONV_A and ride into raised stopper STP_01, where they
# pile up nose to tail; tools/parity_trace.py ("parity-stopper") lowers the stopper at tick 400 and
# the queue releases onto the faster CONV_B. PE_Q stands in the queue (box 3 stops in its beam);
# PE_B on CONV_B sees each released box separately. Training and demo use only. Not a safety-rated
# simulation.
openfactory: "0.1"
scene:
  name: stopper-queue
  description: Five boxes accumulate against a stopper on a running belt, then release.
  seed: 1
components:
  - id: CONV_A
    type: belt_conveyor
    description: Accumulation Belt Conveyor
    position: [0, 0, 0]
    length: 4.0
    width: 0.5
    speed_mps: 0.5
    io:
      run: CONV_A_RUN_DO
  - id: STP_01
    type: stopper
    description: Accumulation Belt Stopper
    position: [3.2, 0, 0]
    io:
      raise: STP_01_RAISE_DO
      raised: STP_01_UP_DI
      lowered: STP_01_DN_DI
  - id: CONV_B
    type: belt_conveyor
    description: Metering Belt Conveyor
    position: [4.0, 0, 0]
    length: 2.0
    width: 0.5
    speed_mps: 1.0
    io:
      run: CONV_B_RUN_DO
  - id: PE_Q
    type: photo_eye
    description: Accumulation Queue Photo Eye
    position: [2.5, 0.1, 0]
    beam_length: 0.6
    io:
      detect: PE_Q_DI
  - id: PE_B
    type: photo_eye
    description: Metering Belt Gap Photo Eye
    position: [5.2, 0.1, 0]
    beam_length: 0.6
    io:
      detect: PE_B_DI
  - id: EMT_01
    type: box_emitter
    description: Queue Box 1 Placement
    position: [2.3, 0.105, 0]       # 5 mm above the belt: lands on the first step
    interval_s: 1000.0            # one box per emitter
    parts:
      - {name: q1, size: [0.3, 0.2, 0.3], weight: 1.0}
  - id: EMT_02
    type: box_emitter
    description: Queue Box 2 Placement
    position: [1.8, 0.105, 0]       # 5 mm above the belt: lands on the first step
    interval_s: 1000.0            # one box per emitter
    parts:
      - {name: q2, size: [0.3, 0.2, 0.3], weight: 1.0}
  - id: EMT_03
    type: box_emitter
    description: Queue Box 3 Placement
    position: [1.3, 0.105, 0]       # 5 mm above the belt: lands on the first step
    interval_s: 1000.0            # one box per emitter
    parts:
      - {name: q3, size: [0.3, 0.2, 0.3], weight: 1.0}
  - id: EMT_04
    type: box_emitter
    description: Queue Box 4 Placement
    position: [0.8, 0.105, 0]       # 5 mm above the belt: lands on the first step
    interval_s: 1000.0            # one box per emitter
    parts:
      - {name: q4, size: [0.3, 0.2, 0.3], weight: 1.0}
  - id: EMT_05
    type: box_emitter
    description: Queue Box 5 Placement
    position: [0.3, 0.105, 0]       # 5 mm above the belt: lands on the first step
    interval_s: 1000.0            # one box per emitter
    parts:
      - {name: q5, size: [0.3, 0.2, 0.3], weight: 1.0}
  - id: REM_B
    type: part_remover
    description: Metering Belt Discharge Part Remover
    position: [6.15, 0, 0]
    size: [0.3, 1.0, 1.0]
connections:
  - {from: CONV_A, to: CONV_B}
