# OpenFactory test scene — training and demo use only. Not a safety-rated simulation.
# PLAN 2.16: the `gated_conveyor` composite from the plan, placed twice in series. GC_01 holds boxes
# at its gate; its computed DI GC_01_WAIT_DI is "gate raised and a box at the eye", an expression
# over two parts' ports. GC_02 runs through with its gate open.
openfactory: "0.1"
scene:
  name: gated-conveyor
  description: Two gated conveyors in series, declared once as a composite.
  author: HIS Controls
  seed: 7
plc:
  protocol: modbus_tcp
composites:
  - type: gated_conveyor
    description: Belt conveyor with a gate stopper near its discharge and a waiting-box eye
    params: {length: 2.0, gate_setback: 0.2}
    parts:
      - {id: belt, type: belt_conveyor, description: Belt Conveyor, position: [0, 0, 0],
         length: "{length}", width: 0.5, speed_mps: 0.4}
      - {id: gate, type: stopper, description: Gate Stopper,
         position: ["{length} - {gate_setback}", 0, 0]}
      - {id: eye, type: photo_eye, description: Waiting Box Photo Eye,
         position: ["{length} - {gate_setback} - 0.2", 0.1, 0], beam_length: 0.6}
    io:
      run: {to: belt.run}
      open: {to: gate.raise, invert: true}     # the gate stands raised unless told to open
      eye: {from: eye.detect}
      waiting: {from: "gate.raised and eye.detect"}
components:
  - id: EMT_01
    type: box_emitter
    description: Infeed Box Source
    position: [0.3, 0.105, 0]
    interval_s: 3.0
    parts:
      - {name: box, size: [0.3, 0.2, 0.3], weight: 1.0}
    io:
      enable: EMT_01_EN_DO
  - id: GC_01
    type: gated_conveyor
    description: Infeed Gated
    position: [0, 0, 0]
    io:
      run: GC_01_RUN_DO
      open: GC_01_OPEN_DO
      eye: GC_01_EYE_DI
      waiting: GC_01_WAIT_DI
  - id: GC_02
    type: gated_conveyor
    description: Outfeed Gated
    position: [2.0, 0, 0]
    length: 3.0
    io:
      run: GC_02_RUN_DO
      open: {tag: GC_02_OPEN_DO, initial: true}
      eye: GC_02_EYE_DI
      waiting: GC_02_WAIT_DI
  - id: REM_01
    type: part_remover
    description: Outfeed Discharge Part Remover
    position: [5.15, 0, 0]
    size: [0.3, 1.0, 1.0]
connections:
  - {from: GC_01_BELT, to: GC_02_BELT}
