  SIM_HEARTBEAT_DI: 1
coils:
  CONV_01_RUN_DO: 0
  EMT_01_EN_DO: 1
input_registers:
  DS_01_DIST_AI: 0
holding_registers: {}
# The range each analog tag is scaled against (raw 0 and raw 32767).
ranges:
  DS_01_DIST_AI: [0, 0.8]
