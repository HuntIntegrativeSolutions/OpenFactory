# Modbus address lockfile for batch-mix-heat.yaml (ADR-0004). Generated by OpenFactory;
# commit it with the scene. Existing tags keep these zero-based addresses; new tags are
# appended after the highest address in their table. A line marked 'not in scene'
# reserves the address of a removed tag; delete the line to free it.
encoding: int16_scaled
discrete_inputs:
  TK_01_LSH_DI: 0
  XV_01_ZSC_DI: 1
  XV_02_ZSC_DI: 2
  SIM_HEARTBEAT_DI: 3
coils:
  HTR_01_ON_DO: 0
  PL_READY_DO: 1
  XV_01_OPEN_DO: 2
  XV_02_OPEN_DO: 3
input_registers:
  TK_01_LT_AI: 0
  TK_01_TT_AI: 1
holding_registers: {}
# The range each analog tag is scaled against (raw 0 and raw 32767).
ranges:
  TK_01_LT_AI: [0, 0.6]
  TK_01_TT_AI: [0, 100]
