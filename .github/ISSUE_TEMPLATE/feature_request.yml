name: Feature request
description: A component, protocol, scene, or tool OpenFactory should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The training, demo, or test task you cannot do today, in plant terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: |
        The behaviour you have in mind: for a component, its ports (DI/DO/AI/AO) and what it does
        each tick; for a protocol, the public specification it follows.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: PLAN task
      description: The docs/PLAN.md task this belongs to, if one exists.
  - type: checkboxes
    id: original-work
    attributes:
      label: Original work
      description: OpenFactory is an original work (CONTRIBUTING.md, "Original Work Policy").
      options:
        - label: This request copies nothing from a commercial product (code, models, textures, scene files, documentation text, names, layouts or other assets) and relies on nothing derived from the internals of a commercial 3D simulator.
          required: true
