# OpenFactory CI (PLAN 1.15). The steps live in tools/ci_local.sh so a local run is identical:
# ruff, pytest, npm run build, npm test, the screenshot runner with its non-blank check, and
# tools/parity_trace.py --check. With CI=true (set by Actions) the viewer, screenshot, and parity
# tests fail instead of skipping when web/dist, node, or Chromium is missing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, test, build, screenshot, parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Each action at its first major release that runs on Node 24 (Node 20 is deprecated on
      # the runners, run 42365962279's annotation); setup-uv@v7 is the last major tag it moves
      - uses: actions/checkout@v5

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          # Exact CPython, the build the local venv and tools/bench_baseline.json use (PLAN 2.9:
          # the tick-cost score moved with the interpreter build, 3.11.15 here, 3.11.18 on CI)
          python-version: "3.11.15"
          enable-cache: true

      - name: Set up Node 22 (Vite 8 needs 20.19+ or 22.12+)
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies (with the logix and opcua extras)
        run: uv sync --frozen --all-extras

      - name: Install Playwright Chromium and its system libraries
        run: uv run playwright install --with-deps chromium

      - name: Install Mosquitto, the Sparkplug tests' third-party broker (PLAN 3.5)
        # each test starts its own broker on a free loopback port; the packaged service is stopped
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mosquitto
          sudo systemctl stop mosquitto || true

      - name: CI steps (tools/ci_local.sh)
        run: bash tools/ci_local.sh

      - name: Keep the CI screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-screenshot
          path: tools/screenshots/ci-sorting-by-height.png
          if-no-files-found: ignore

      - name: Keep the SBOM (PLAN 4.8; built by tools/sbom.py, never committed)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: build/sbom/
          if-no-files-found: ignore
