# OpenFactory docs site (PLAN 4.4): MkDocs Material built from docs/ and deployed to GitHub Pages.
# CI (tools/ci_local.sh step 13) builds the same site with --strict on every run; this workflow
# only publishes it. It needs the repository's Pages source set to "GitHub Actions"; until then a
# run on every push would fail at the deploy, so it runs only when started by hand (Actions ->
# Docs -> Run workflow). Once Settings -> Pages -> Source is "GitHub Actions", add
#   push:
#     branches: [main]
# under `on:` so every push to main publishes the site (ruled 2026-11-09).
# Actions are on their first major that runs on Node 24 (GitHub's Node 20 deprecation, as in
# ci.yml): checkout v5, setup-uv v7, upload-pages-artifact v5 (wraps upload-artifact v7, node24;
# leaves hidden files out, and the built site has none) and deploy-pages v5.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python 3.11.15
        uses: astral-sh/setup-uv@v7
        with:
          # the exact CPython ci.yml and .python-version pin (PLAN 2.9, ruled 2026-11-08)
          python-version: "3.11.15"

      - name: Install Python dependencies (the hook reads the component registry)
        run: uv sync --frozen --all-extras

      - name: Build the site, failing on any warning
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
