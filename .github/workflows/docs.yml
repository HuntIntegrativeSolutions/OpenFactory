# OpenFactory docs site (PLAN 4.4): MkDocs Material built from docs/ and deployed to GitHub Pages
# on every push to main. CI (tools/ci_local.sh step 13) builds the same site with --strict on every
# run; this workflow only publishes it. Needs the repository's Pages source set to "GitHub Actions".
# Actions are on their first major that runs on Node 24 (GitHub's Node 20 deprecation, as in
# ci.yml): checkout v5, setup-uv v7, upload-pages-artifact v5 (wraps upload-artifact v7, node24;
# leaves hidden files out, and the built site has none) and deploy-pages v5.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies (the hook reads the component registry)
        run: uv sync --frozen --all-extras

      - name: Build the site, failing on any warning
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
