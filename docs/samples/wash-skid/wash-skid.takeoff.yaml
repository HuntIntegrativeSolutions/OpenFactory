  - {row: IO-10, equipment: CV-201, port: run, signal: DO, plc_tag: CV201.Run,
     ref: [{sheet: IO-001, row: 10}], confidence: read, questions: []}
  - {row: IO-11, equipment: CV-201, port: running, signal: DI, plc_tag: CV201.Running,
