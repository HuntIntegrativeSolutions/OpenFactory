  - {row: IO-2, equipment: LV-101, port: position_fb, signal: AI, plc_tag: LV101_POS,
     ref: [{sheet: IO-001, row: 2}], confidence: read, questions: []}
  - {row: IO-3, equipment: TK-101, port: hi_sw, signal: DI, plc_tag: LSH101,
