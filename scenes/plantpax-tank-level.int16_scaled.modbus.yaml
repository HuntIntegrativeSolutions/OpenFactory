# commit it with the scene. Existing tags keep these zero-based addresses; new tags are
# appended after the highest address in their table. A line marked 'not in scene'
# reserves the address of a removed tag; delete the line to free it.
encoding: int16_scaled
discrete_inputs:
  P_01_RUN_DI: 0
  TK_01_LSH_DI: 1
  TK_01_LSL_DI: 2
  SIM_HEARTBEAT_DI: 3
coils:
  P_01_RUN_DO: 0
input_registers:
  FV_01_ZT_AI: 0
  TK_01_LT_AI: 1
holding_registers:
  FV_01_POS_AO: 0
# The range each analog tag is scaled against (raw 0 and raw 32767).
ranges:
  FV_01_POS_AO: [0, 100]
  FV_01_ZT_AI: [0, 100]
  TK_01_LT_AI: [0, 2]
